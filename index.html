<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessMind - Tutor Invisible de Ajedrez</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .board { width: 100%; max-width: 400px; }
    #tutor-msg { line-height: 1.5; }
    .ok { color: #1e8449; } .warn { color: #b9770e; } .bad { color: #c0392b; }
    .btn { border: 0; border-radius: 6px; padding: 8px 12px; margin: 4px 4px 0 0;
           background: #2c3e50; color: #fff; cursor: pointer; font-size: 14px; }
    .btn.secondary { background: #7f8c8d; }
    #mission-meta { font-size: 13px; color: #777; margin: 0 0 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ChessMind ♟️</h1>
      <p>Tutor Inteligente de Ajedrez (Stealth Assessment)</p>
    </header>

    <main class="main-content">
      <div id="board" class="board"></div>

      <div class="panel">
        <div id="mission-box" class="card">
          <h2>Misión Actual</h2>
          <p id="mission-meta"></p>
          <p id="mission-desc">Cargando posición...</p>
        </div>

        <div id="tutor-box" class="card">
          <h3>🎓 Tutor</h3>
          <p id="tutor-msg">Arrastra una pieza para responder. Si te atoras, pide una pista.</p>
          <button id="hint-btn" class="btn secondary">💡 Pista</button>
          <button id="retry-btn" class="btn hidden">↩ Reintentar</button>
          <button id="next-btn" class="btn hidden">Siguiente ➜</button>
        </div>

        <div id="metrics" class="card">
          <h3>Diagnóstico en Tiempo Real</h3>
          <p>Elo Estimado: <strong id="elo-display">1000</strong></p>
          <div class="metric-info">
            <span>Visión Táctica</span>
            <div class="progress-bar"><div id="tactics-bar" style="width: 50%;"></div></div>
          </div>
        </div>

        <div id="feedback-box" class="card hidden">
          <h2>Perfil de Competencias Generado</h2>
          <pre id="profile-output"></pre>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
