<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessMind - Tutor Invisible de Ajedrez</title>
  
  <!-- Estilos del Tablero y de la App -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>ChessMind ♟️</h1>
      <p>Tutor Inteligente de Ajedrez (Stealth Assessment)</p>
    </header>

    <main class="main-content">
      <!-- Tablero de ajedrez interactivo -->
      <div id="board" class="board"></div>
      
      <!-- Panel lateral de diagnóstico -->
      <div class="panel">
        <div id="mission-box" class="card">
          <h2>Misión Actual</h2>
          <p id="mission-desc">Cargando posición...</p>
        </div>

        <div id="metrics" class="card">
          <h3>Diagnóstico en Tiempo Real</h3>
          <p>Elo Estimado: <strong id="elo-display">1000</strong></p>
          <div class="metric-info">
            <span>Visión Táctica</span>
            <div class="progress-bar"><div id="tactics-bar" style="width: 50%;"></div></div>
          </div>
        </div>

        <div id="feedback-box" class="card hidden">
          <h2>Perfil de Competencias Generado</h2>
          <pre id="profile-output"></pre>
        </div>
      </div>
    </main>
  </div>

  <!-- Librerías de Ajedrez y Código Principal -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
